# Title: Quickstart: Run SQL Server Linux container images with Docker
# Type: [Source Code]
# Available at: <https://learn.microsoft.com/en-us/sql/linux/quickstart-install-connect-docker?view=sql-server-ver17> [Accessed 18 May 2026]
##############################################################################################################

services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env}"
    ports:
      - "14333:1433"
    volumes:
      - glms-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    depends_on:
      sql-server-db:
        condition: service_healthy
    restart: on-failure
    environment:
      ExchangeRateApi__ApiKey: "${EXCHANGE_RATE_API_KEY:-}"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__GlmsDb: "Server=sql-server-db,1433;Database=GLMS_Api;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: "GLMS.Api"
      Jwt__Audience: "GLMS.Web"
      Jwt__Key: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your local .env}"
      Auth__Username: "${GLMS_AUTH_USERNAME:?Set GLMS_AUTH_USERNAME in your local .env}"
      Auth__Password: "${GLMS_AUTH_PASSWORD:?Set GLMS_AUTH_PASSWORD in your local .env}"
    ports:
      - "8080:8080"

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      GLMS_API_BASE_URL: "http://glms-backend-api:8080/"
      ApiSettings__Username: "${GLMS_AUTH_USERNAME:?Set GLMS_AUTH_USERNAME}"
      ApiSettings__Password: "${GLMS_AUTH_PASSWORD:?Set GLMS_AUTH_PASSWORD}"
    ports:
      - "8081:8080"

volumes:
  glms-sql-data:
